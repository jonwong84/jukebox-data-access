version: 2.1

jobs:
  build-and-test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Jukebox.DataAccess.Contracts/Jukebox.DataAccess.Contracts.csproj"
            dotnet restore "src/Jukebox.DataAccess.EntityFramework/Jukebox.DataAccess.EntityFramework.csproj"
            dotnet restore "src/Jukebox.DataAccess/Jukebox.DataAccess.csproj"
      - run:
          name: Build
          command: |
            dotnet build "src/Jukebox.DataAccess.Contracts/Jukebox.DataAccess.Contracts.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Jukebox.DataAccess.EntityFramework/Jukebox.DataAccess.EntityFramework.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Jukebox.DataAccess/Jukebox.DataAccess.csproj" \
              --configuration Release \
              --no-restore

  sonar-scan:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Install Node.js and changelog-parser
          command: |
            apt-get update && apt-get install -y nodejs npm
            npm install -g changelog-parser
      - run:
          name: Install SonarScanner
          command: |
            dotnet tool install --global dotnet-sonarscanner
            export PATH="$PATH:/root/.dotnet/tools"
            echo 'export PATH="$PATH:/root/.dotnet/tools"' >> $BASH_ENV
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Jukebox.DataAccess.Contracts/Jukebox.DataAccess.Contracts.csproj"
            dotnet restore "src/Jukebox.DataAccess.EntityFramework/Jukebox.DataAccess.EntityFramework.csproj"
            dotnet restore "src/Jukebox.DataAccess/Jukebox.DataAccess.csproj"
      - run:
          name: Begin SonarScan
          command: |
            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
            COVERAGE_REPORT="$PWD/src/Jukebox.DataAccess.Tests/coverage.opencover.xml"
            dotnet sonarscanner begin \
              /k:"jonwong84_jukebox-data-access" \
              /o:"jonwong84" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.pullrequest.key="$PR_NUMBER" \
              /d:sonar.pullrequest.branch="$CIRCLE_BRANCH" \
              /d:sonar.pullrequest.base="main" \
              /d:sonar.cs.opencover.reportsPaths="$COVERAGE_REPORT" \
              /d:sonar.tests="src/Jukebox.DataAccess.Tests" \
              /d:sonar.test.inclusions="src/Jukebox.DataAccess.Tests/**/*.cs"
      - run:
          name: Build
          command: |
            dotnet build "src/Jukebox.DataAccess.Contracts/Jukebox.DataAccess.Contracts.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Jukebox.DataAccess.EntityFramework/Jukebox.DataAccess.EntityFramework.csproj" \
              --configuration Release \
              --no-restore
            dotnet build "src/Jukebox.DataAccess/Jukebox.DataAccess.csproj" \
              --configuration Release \
              --no-restore
      - run:
          name: End SonarScan
          command: |
            dotnet sonarscanner end \
              /d:sonar.token="$SONAR_TOKEN"

  publish-contracts:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Install Node.js and changelog-parser
          command: |
            apt-get update && apt-get install -y nodejs npm
            npm install -g changelog-parser
      - run:
          name: Resolve package version
          command: |
            BASE_VERSION=$(changelog-parser CHANGELOG.md | \
              node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
                const releases=JSON.parse(d).versions.filter(v=>v.version); \
                console.log(releases[0].version);")

            if [ "$CIRCLE_BRANCH" = "main" ]; then
              PACKAGE_VERSION="$BASE_VERSION"
            else
              DATETIME=$(date -u +"%Y%m%d%H%M%S")
              PACKAGE_VERSION="${BASE_VERSION}-beta.${DATETIME}"
            fi

            echo "Resolved version: $PACKAGE_VERSION"
            echo "export PACKAGE_VERSION='$PACKAGE_VERSION'" >> $BASH_ENV
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Jukebox.DataAccess.Contracts/Jukebox.DataAccess.Contracts.csproj"
      - run:
          name: Pack
          command: |
            dotnet pack "src/Jukebox.DataAccess.Contracts/Jukebox.DataAccess.Contracts.csproj" \
              --configuration Release \
              --no-restore \
              /p:Version=$PACKAGE_VERSION \
              --output ./artifacts
      - run:
          name: Publish Jukebox.DataAccess.Contracts to GitHub Packages
          command: |
            dotnet nuget push ./artifacts/*.nupkg \
              --api-key "$GITHUB_TOKEN" \
              --source "github" \
              --skip-duplicate

  publish-entityframework:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Install Node.js and changelog-parser
          command: |
            apt-get update && apt-get install -y nodejs npm
            npm install -g changelog-parser
      - run:
          name: Resolve package version
          command: |
            BASE_VERSION=$(changelog-parser CHANGELOG.md | \
              node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
                const releases=JSON.parse(d).versions.filter(v=>v.version); \
                console.log(releases[0].version);")

            if [ "$CIRCLE_BRANCH" = "main" ]; then
              PACKAGE_VERSION="$BASE_VERSION"
            else
              DATETIME=$(date -u +"%Y%m%d%H%M%S")
              PACKAGE_VERSION="${BASE_VERSION}-beta.${DATETIME}"
            fi

            echo "Resolved version: $PACKAGE_VERSION"
            echo "export PACKAGE_VERSION='$PACKAGE_VERSION'" >> $BASH_ENV
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Jukebox.DataAccess.EntityFramework/Jukebox.DataAccess.EntityFramework.csproj"
      - run:
          name: Pack
          command: |
            dotnet pack "src/Jukebox.DataAccess.EntityFramework/Jukebox.DataAccess.EntityFramework.csproj" \
              --configuration Release \
              --no-restore \
              /p:Version=$PACKAGE_VERSION \
              --output ./artifacts
      - run:
          name: Publish Jukebox.DataAccess.EntityFramework to GitHub Packages
          command: |
            dotnet nuget push ./artifacts/*.nupkg \
              --api-key "$GITHUB_TOKEN" \
              --source "github" \
              --skip-duplicate

  publish-dataaccess:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Install Node.js and changelog-parser
          command: |
            apt-get update && apt-get install -y nodejs npm
            npm install -g changelog-parser
      - run:
          name: Resolve package version
          command: |
            BASE_VERSION=$(changelog-parser CHANGELOG.md | \
              node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
                const releases=JSON.parse(d).versions.filter(v=>v.version); \
                console.log(releases[0].version);")

            if [ "$CIRCLE_BRANCH" = "main" ]; then
              PACKAGE_VERSION="$BASE_VERSION"
            else
              DATETIME=$(date -u +"%Y%m%d%H%M%S")
              PACKAGE_VERSION="${BASE_VERSION}-beta.${DATETIME}"
            fi

            echo "Resolved version: $PACKAGE_VERSION"
            echo "export PACKAGE_VERSION='$PACKAGE_VERSION'" >> $BASH_ENV
      - run:
          name: Restore dependencies
          command: |
            dotnet restore "src/Jukebox.DataAccess/Jukebox.DataAccess.csproj"
      - run:
          name: Pack
          command: |
            dotnet pack "src/Jukebox.DataAccess/Jukebox.DataAccess.csproj" \
              --configuration Release \
              --no-restore \
              /p:Version=$PACKAGE_VERSION \
              --output ./artifacts
      - run:
          name: Publish Jukebox.DataAccess to GitHub Packages
          command: |
            dotnet nuget push ./artifacts/*.nupkg \
              --api-key "$GITHUB_TOKEN" \
              --source "github" \
              --skip-duplicate

workflows:
  build-test-publish:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
      - sonar-scan:
          context: global-v1
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - /^feature\/.*/
      - publish-contracts:
          context: global-v1
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
      - publish-entityframework:
          context: global-v1
          requires:
            - publish-contracts
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
      - publish-dataaccess:
          context: global-v1
          requires:
            - publish-entityframework
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/